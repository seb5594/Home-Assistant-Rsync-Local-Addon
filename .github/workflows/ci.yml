name: Validate and release app

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft for review
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  pipeline:
    # Repository secrets are not passed to untrusted fork pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: seb5594/hass-workflows
          ref: 1644db9591c7cf2663e34a4019b01a0c8f35c1ba
          token: ${{ secrets.ORCHESTRATION_PAT }}
          path: .engine
          persist-credentials: false
      - uses: ./.engine/.actions/project
        with:
          token: ${{ github.token }}
          draft: ${{ inputs.draft }}
          catalog-token: ${{ secrets.ORCHESTRATION_PAT }}
