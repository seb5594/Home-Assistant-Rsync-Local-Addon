name: App CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  run-ci:
    uses: seb5594/hass-workflows/.github/workflows/engine-app-ci.yml@main
    with:
      app_name: rsync-local

  dispatch-update:
    needs: run-ci
    if: github.ref == 'refs/heads/main'
    uses: seb5594/hass-workflows/.github/workflows/engine-dispatch-update.yml@main
    with:
      target_repo: seb5594/Home-Assistant-Apps
    secrets:
      PAT_TOKEN: ${{ secrets.ORCHESTRATION_PAT }}
