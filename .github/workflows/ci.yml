name: Validate and release app

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  pipeline:
    # Repository secrets are not passed to untrusted fork pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: seb5594/hass-workflows
          ref: bd27a61b160988ae6202cb6b4589c05818ce9397
          token: ${{ secrets.ORCHESTRATION_PAT }}
          path: .engine
          persist-credentials: false
      - uses: ./.engine/.actions/project
        with:
          token: ${{ github.token }}
          catalog-token: ${{ secrets.ORCHESTRATION_PAT }}
