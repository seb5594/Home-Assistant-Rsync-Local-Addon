name: Notify Main Repository

# yamllint disable-line rule:truthy
on:
  push:
    branches: ['**'] # The job below selects the repository's actual default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository_owner == 'seb5594' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }} # Also configure this secret in each source repository.
    steps:
      - name: Explain missing optional configuration
        if: env.PAT_TOKEN == ''
        run: echo "::warning::Set PAT_TOKEN to enable immediate synchronization. Scheduled updates remain available."

      - name: Trigger Update in Home-Assistant-Apps
        if: env.PAT_TOKEN != ''
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: seb5594/Home-Assistant-Apps
          event-type: update-addons
          client-payload: >-
            {"repository": "${{ github.repository }}", "sha": "${{ github.sha }}", "ref": "${{ github.ref }}"}
