name: probe
on:
  push:
    branches: [claude/upbeat-faraday-14izad]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: docker run --rm alpine:3.24.2 sh -c 'apk add --simulate bash jq rsync coreutils | grep -E "Installing (bash|jq|rsync|coreutils) "'
